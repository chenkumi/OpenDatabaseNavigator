name: 功能建議 / Feature request
description: 建議新功能或改進 / Suggest a feature or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解決的問題 / The problem
      description: 你想完成什麼事、目前哪裡不方便 / What are you trying to do and what is hard today
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建議的做法 / Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考慮過的替代方案 / Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: 範圍 / Area
      multiple: true
      options:
        [
          桌面介面 / Desktop UI,
          查詢與資料 / Queries and data,
          結構設計 / Schema design,
          Redis,
          'MCP / Agent',
          新資料庫引擎 / New database engine,
          其他 / Other,
        ]
