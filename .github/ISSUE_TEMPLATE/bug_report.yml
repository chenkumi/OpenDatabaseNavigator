name: 回報問題 / Bug report
description: 程式行為與預期不符 / Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        請**不要**貼上密碼、token 或真實資料。安全漏洞請依儲存庫根目錄的 SECURITY.md 私下通報，不要開公開 issue。
        Please do **not** paste passwords, tokens or real data. Report vulnerabilities privately (see SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: 發生了什麼事 / What happened
      description: 實際看到的行為與錯誤訊息 / The behaviour you saw and any error message
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 預期的行為 / Expected behaviour
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 重現步驟 / Steps to reproduce
      placeholder: |
        1. 連線到 ...
        2. 開啟 ...
        3. 按下 ...
    validations:
      required: true
  - type: dropdown
    id: engine
    attributes:
      label: 資料庫 / Database
      options:
        [
          SQLite,
          PostgreSQL,
          MySQL,
          MariaDB,
          SQL Server,
          Redis,
          'SAP/Sybase ASE',
          與資料庫無關 / Not database specific,
        ]
    validations:
      required: true
  - type: input
    id: engine-version
    attributes:
      label: 資料庫版本 / Database version
      placeholder: '例如 PostgreSQL 17.4 / e.g. PostgreSQL 17.4'
  - type: input
    id: os
    attributes:
      label: 作業系統 / Operating system
      placeholder: Windows 11 23H2
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js 版本 / Node.js version
      placeholder: v24.x
  - type: textarea
    id: logs
    attributes:
      label: 其他資訊 / Additional context
      description: 截圖或日誌（請先移除機密與你自己的主機、資料庫名稱）/ Screenshots or logs (remove secrets and your own host or database names first)
