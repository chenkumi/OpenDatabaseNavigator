name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Unit tests
        run: npm test
      - run: npm run build
  # Real-database tests are skipped by `npm test`. Run them on demand so a green
  # unit run is never mistaken for database coverage.
  integration:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run integration:up
      - run: npm run test:integration
      - if: always()
        run: npm run integration:stop
